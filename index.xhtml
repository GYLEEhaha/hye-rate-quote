<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AQ国际 · 内部运价查询</title>
  <style type="text/css"><![CDATA[
    html, body { margin: 0; padding: 0; height: 100%; background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; }
    #boot { padding: 2rem; text-align: center; }
    iframe { border: 0; width: 100%; height: 100%; display: none; }
    iframe.ready { display: block; }
    .err { color: #fca5a5; white-space: pre-wrap; }
  ]]></style>
  <script type="text/javascript"><![CDATA[
(async function () {
  var refs = ["38f3b462b3a5a880a40c3d07959bf03782673574", "main"];
  var hosts = [
    "https://cdn.jsdmirror.com/gh/GYLEEhaha/hye-rate-quote@",
    "https://cdn.jsdelivr.net/gh/GYLEEhaha/hye-rate-quote@",
    "https://testingcf.jsdelivr.net/gh/GYLEEhaha/hye-rate-quote@"
  ];
  var cdns = [];
  for (var r = 0; r < refs.length; r++) {
    for (var h = 0; h < hosts.length; h++) {
      cdns.push(hosts[h] + refs[r] + "/");
    }
  }
  var boot = document.getElementById("boot");
  var frame = document.getElementById("app");
  var lastErr = null;
  for (var i = 0; i < cdns.length; i++) {
    var base = cdns[i];
    try {
      var res = await fetch(base + "index.html", { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status + " for " + base);
      var html = await res.text();
      if (html.indexOf("<html") === -1 && html.indexOf("<HTML") === -1) {
        throw new Error("Not HTML from " + base);
      }
      if (/<base\s/i.test(html)) {
        html = html.replace(/<base\s[^>]*>/i, '<base href="' + base + '" />');
      } else {
        html = html.replace(/<head([^>]*)>/i, function (_m, attrs) { return '<head' + attrs + '><base href="' + base + '" />'; });
      }
      frame.srcdoc = html;
      frame.className = "ready";
      if (boot) boot.style.display = "none";
      return;
    } catch (e) {
      lastErr = e;
    }
  }
  if (boot) {
    boot.innerHTML = '<p class="err">加载失败：' + String(lastErr && lastErr.message || lastErr) +
      '\n\n可改用 GitHub Pages（需可访问 GitHub）：\nhttps://gyleehaha.github.io/hye-rate-quote/</p>';
  }
})();
  ]]></script>
</head>
<body>
  <div id="boot"><p>AQ国际 运价查询加载中…</p></div>
  <iframe id="app" title="AQ国际运价查询"></iframe>
</body>
</html>
